${faq.map(([a,b,r])=>html`<div key=${r} className="card"><div className="text-sm font-semibold">${a}</div><div className="text-sm mu">${b}</div><div className="text-xs text-teal-600 mt-1">✓ ${r}</div></div>`)}</div>`}

${tab==="Trends"&&html`<div className="space-y-3"><div className="card hd"><div className="font-bold"><${I} n="spark"/> AI Trend Clustering</div><div className="text-sm opacity-80">44 field observations from 62 reps grouped into 4 trends this month</div></div>
${TR.map((t,i)=>html`<div key=${i} className="card space-y-1"><div className="flex justify-between"><span className=${"text-xs font-bold px-2 py-0.5 rounded-full "+(t[0]==="High"?"bg-rose-100 text-rose-800":t[0]==="Medium"?"bg-amber-100 text-amber-800":"bg-slate-200 text-slate-800")}>${t[0]} Priority</span><span className="text-xs mu">${t[4]}</span></div>
<div className="font-semibold text-sm">${t[1]}</div><div className="h-2 rounded-full" style=${{background:"var(--bg)"}}><div className="h-2 rounded-full bg-teal-500" style=${{width:t[3]*5+"%"}}></div></div>
<button className=${"btn2 "+(esc[i]?"!bg-emerald-100 !text-emerald-800":"")} onClick=${()=>{setEsc({...esc,[i]:1});say("Escalated to "+t[2])}}>${esc[i]?"✓ Escalated":"Escalate to "+t[2]}</button></div>`)}</div>`}

${tab==="Co-Pilot"&&html`<div className="space-y-3"><div className="card space-y-2"><h3 className="font-bold">HCP Case & Action Log</h3>
<select className="inp" value=${ld} onChange=${e=>setLd(+e.target.value)}>${DOCS.map((d,i)=>html`<option key=${i} value=${i}>${d[0]} – ${d[1]}</option>`)}</select>
<select className="inp" value=${lo} onChange=${e=>setLo(e.target.value)}>${["Discuss new indication","Follow up on trial samples","Invite to upcoming event"].map(o=>html`<option key=${o}>${o}</option>`)}</select>
<input className="inp" placeholder="Topics the doctor wants to discuss" value=${tp} onChange=${e=>setTp(e.target.value)}/>
<input className="inp" placeholder="Requests (samples, materials, invitation…)" value=${rq} onChange=${e=>setRq(e.target.value)}/>
<div className="flex gap-2"><select className="inp" value=${ng} onChange=${e=>setNg(e.target.value)}>${["Awareness","Interest","Trial","Negotiation","Prescribing"].map(o=>html`<option key=${o}>${o}</option>`)}</select><input className="inp" placeholder="Deal / negotiation progress" value=${dl} onChange=${e=>setDl(e.target.value)}/></div>
<textarea className="inp" placeholder="Quick call notes…" value=${ln} onChange=${e=>setLn(e.target.value)}/>
<div className="flex gap-2"><button className="btn" onClick=${()=>{setLogs([{d:ld,o:lo,n:ln,tp,rq,ng,dl},...logs]);setLn("");setTp("");setRq("");setDl("");say("Visit saved – you’ll get a reminder next time you’re near")}}>Save note</button>
<button className="btn2" onClick=${()=>setPop(ld)}><${I} n="bell"/> Simulate Next Clinic Visit Pop-up</button></div></div>
<div className="card space-y-2"><h3 className="font-bold"><${I} n="spark"/> Visit Voice Notes <span className="text-xs mu font-normal">– تسجيل الكلام أثناء الزيارة</span></h3>
<div className="text-xs mu">Visit with ${DOCS[ld][0]} (selected above). Record only with the doctor’s consent.</div>
<select className="inp" value=${lang} onChange=${e=>setLang(e.target.value)}><option value="en-US">English</option><option value="ar-EG">العربية (مصر)</option></select>
<div className="flex gap-2 flex-wrap">${rec?html`<button className="btn !bg-rose-600" onClick=${stopRec}><span className="animate-pulse">●</span> Stop</button>`:html`<button className="btn" onClick=${startRec}>🎙 Start recording</button>`}<button className="btn2" onClick=${demo}>Play demo conversation</button></div>
<textarea className="inp" rows="4" placeholder="Live transcript appears here (editable)…" value=${tr} onChange=${e=>setTr(e.target.value)}/>
<button className="btn2" onClick=${analyze}><${I} n="spark"/> Analyze with AI</button>
${an&&html`<div className="space-y-2 text-sm">
<div><b>Products mentioned:</b> ${an.prods.join(", ")||"—"}</div>
${an.pv&&html`<div className="p-2 rounded-lg bg-rose-100 text-rose-800"><${I} n="alert"/> Possible adverse event heard – must be reported to Pharmacovigilance. <button className="underline font-semibold" onClick=${()=>say("PV report created")}>Report to PV</button></div>`}
${an.comp&&html`<div className="p-2 rounded-lg bg-amber-100 text-amber-900">Competitor insight detected. <button className="underline font-semibold" onClick=${()=>{setSubs([{id:Date.now()%1000+300,d:"Marketing",t:"Voice insight: "+DOCS[ld][0]+" compares with Competitor X",s:"Received"},...subs]);say("Sent to Marketing")}}>Send to Marketing</button></div>`}
${an.ev&&html`<div className="p-2 rounded-lg bg-teal-100 text-teal-900">Interested in an event – add to the Events guest list.</div>`}
${an.sm&&html`<div className="p-2 rounded-lg bg-teal-100 text-teal-900">Samples requested – follow-up task suggested.</div>`}
<button className="btn" onClick=${()=>{setLogs([{d:ld,o:an.ev?"Invite to upcoming event":an.sm?"Follow up on trial samples":lo,n:tr},...logs]);setTr("");setAn(null);say("Saved to HCP log")}}>Save to HCP log</button></div>`}</div>
${logs.map((l,i)=>html`<div key=${i} className="card text-sm"><b>${DOCS[l.d][0]}</b> · <span className="text-teal-600">${l.o}</span><div className="mu">${l.n||"—"}</div>${l.ng&&html`<div className="text-xs">Stage: <b>${l.ng}</b>${l.dl?" · "+l.dl:""}</div>`}${l.tp&&html`<div className="text-xs">Topics: ${l.tp}</div>`}${l.rq&&html`<div className="text-xs">Requested: ${l.rq}</div>`}</div>`)}
${pop!==null&&html`<div className="fixed inset-0 z-30 flex items-end sm:items-center justify-center bg-black/60 p-3"><div className="w-full max-w-sm rounded-3xl p-4 space-y-2" style=${{background:"var(--card)",color:"var(--tx)",border:"1px solid var(--bd)"}}>
<div className="flex justify-between items-center"><b className="text-teal-600"><${I} n="bell"/> Pre-Visit Alert</b><button onClick=${()=>setPop(null)}><${I} n="x"/></button></div>
<div className="font-bold">${DOCS[pop][0]} <span className="mu text-sm font-normal">· ${DOCS[pop][1]}</span></div>
<div className="text-xs p-2 rounded-lg bg-slate-200 text-slate-800">📍 You’re about 300 m from ${DOCS[pop][0]}’s clinic</div>
<div className="text-sm"><b>Last visit:</b> ${lgOf(pop)?(lgOf(pop).n||"Visit logged"):DOCS[pop][2]}</div>
${lgOf(pop)&&html`<div className="text-sm"><b>Where you left off:</b> ${lgOf(pop).ng}${lgOf(pop).dl?" – "+lgOf(pop).dl:""}</div>`}
${lgOf(pop)&&lgOf(pop).tp&&html`<div className="text-sm"><b>He wants to discuss:</b> ${lgOf(pop).tp}</div>`}
<div className="text-sm p-2 rounded-lg bg-teal-100 text-teal-900"><b>Today’s objective:</b> ${(logs.find(l=>l.d===pop)||{}).o||"Discuss new indication"}</div>
<div className="text-sm p-2 rounded-lg" style=${{background:"var(--bg)"}}><b>💡 Tips for this visit</b>${tipsFor(lgOf(pop)).map(t=>html`<div key=${t}>• ${t}</div>`)}</div>
<div className="text-sm p-2 rounded-lg bg-emerald-100 text-emerald-900"><b>New approved answer:</b> ${approved?approved.q+" ("+approved.ref+")":faq[0][0]+" ("+faq[0][2]+")"}</div>
<div className="text-sm p-2 rounded-lg bg-amber-100 text-amber-900"><b>Matching event:</b> ${ev.t} · ${ev.d} · ${ev.v}</div>
<button className="btn w-full" onClick=${()=>{setPop(null);say("Visit started")}}>Start visit</button></div></div>`}</div>`}

${tab==="Events"&&html`<div className="space-y-3"><div className="flex gap-2 overflow-x-auto">${evs.map((e,i)=>html`<button key=${i} onClick=${()=>setEvI(i)} className=${"card !p-2 text-left min-w-[150px] "+(evI===i?"!border-teal-500":"")}><div className="text-teal-600 font-bold text-sm">${e.d}</div><div className="text-sm font-semibold">${e.t}</div><div className="text-xs mu">${e.v}</div></button>`)}</div>
<div className="card"><h3 className="font-bold">${evs[evI].t}</h3><div className="text-sm mu">${evs[evI].d} · ${evs[evI].v} · Speaker: ${evs[evI].sp}</div></div>
${["A","B"].map(l=>html`<div key=${l} className="card space-y-2"><h4 className="font-bold">${l==="A"?"Plan A – Primary invitees":"Plan B – Backup doctors"}</h4>
${evs[evI][l].map((g,i)=>html`<div key=${g.n} className="flex items-center gap-2"><button onClick=${()=>cyc(l,i)} className="flex items-center gap-2 flex-1 text-left"><span className=${"w-6 h-6 rounded-md flex items-center justify-center border "+(g.s==="Confirmed"?"bg-emerald-500 border-emerald-500 text-white":g.s==="Declined"?"bg-rose-500 border-rose-500 text-white":"")}>${g.s==="Confirmed"?html`<${I} n="check" s=${14}/>`:g.s==="Declined"?html`<${I} n="x" s=${14}/>`:""}</span><span className="text-sm">${g.n}</span></button><${Badge} s=${g.s}/>
${l==="B"&&html`<button className="btn2" onClick=${()=>promote(i)}><${I} n="up" s=${12}/> To Plan A</button>`}</div>`)}</div>`)}
<div className="text-xs mu">Tap a doctor to cycle Pending → Confirmed → Declined.</div></div>`}
</main>
${toast&&html`<div className="fixed left-1/2 -translate-x-1/2 bottom-6 z-40 hd px-4 py-2 rounded-full text-sm shadow-lg">${toast}</div>`}
</div>`}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script></body></html>
